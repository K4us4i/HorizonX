<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Community Events</h1>
    <input type="text" id="searchBar" placeholder="Search by name, location, category..." onkeyup="filterEvents()">

    <div id="stats">
    Total Events: <span id="totalEvents">5</span> | Reported Events: <span id="reportedEvents">0</span>
    </div>

    <div id="event-list">
        <div class="event-card" data-category="Cultural" data-reports="0">
        <div class="event-title">Indra Jatra Festival</div>
        <div class="event-date">14 September 2025</div>
        <div class="event-location">Basantapur, Kathmandu</div>
        <div class="event-category badge category-Cultural">Cultural</div>
        <div class="event-desc short-desc" onclick="toggleDesc(this)">
        A major cultural festival of Kathmandu celebrating living goddess Kumari... <span style="color:#1d3557;font-weight:bold;">[Details]</span>
        </div>
    </div>

</body>
</html>
