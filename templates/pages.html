<!DOCTYPE html>
<html>
<head>
<style>
    body{
        background-color: bisque;
        font-family: 'Courier New', Courier, monospace;
        margin: 0px;
        padding: 0px;
    }
    header
    {
       text-align: center; 
       color: rgb(242, 65, 65);
       font-size: 30px;
       font-weight: bold;
       margin: 20px 0;
    }
    button{
        background-color: aquamarine;
        border: none;
        color: aliceblue;
       padding: 15px 32px;
       text-align: center;
       cursor: pointer;
    }
    .container{
        padding: 20px;
        margin-right: 20px;
        border-radius: 8px;
       box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    .container.container:hoover
    {
        transform: translateY(-5px);
        box-shadow: 0 4px 10px rgb(237, 138, 72);
    }
    .container h2{
        text-align: center;
        color: azure;
    }
    button{
         margin-right: 10px;
         padding: 14px 16px;
         border: none;
         cursor: pointer;
         border-radius: 6px;
         font-size: 16px;
         transition: 0.3s;
         display: block;
         margin-left: auto;
         margin-right: auto;



    }
  </style>
</head>
<body>
    <header>Community Connectivity</header>
    <div class="container" style="background-color: rgb(142, 233, 135);" style="width: 10px;" style="border: 10px;">
    <h2>Events</h2>
    <button onclick="loadEvents()">Show Events</button>
    <div id="events"></div>
    </div>
    <br>

    <div class="container" style="background-color: rgb(142, 233, 135);" style="width: 10px;" style="border:10px">
    <h2>Disaster Alerts</h2>
    <button onclick="loadAlerts()">Show Alerts</button>
    <div id="alerts"></div>
    </div>

    <script>
    function loadEvents() {
    fetch("/events")
        .then(res => res.json())
        .then(data => {
            document.getElementById("events").innerHTML = data.map(e => `<p>${e.date} — ${e.localName}</p>`).join("");
        });
    }
    function loadAlerts() {
    fetch("/alerts")
        .then(res => res.json())
        .then(data => {
            document.getElementById("alerts").innerHTML = data.results.map(n => `<p>${n.title}</p>`).join("");
        });
    }
    </script>
</body>
</html>
