<!DOCTYPE html>
<html>
<head>
    <title>Community Connectivity</title>
</head> 
<body>
    <h2>Events</h2>
    <button onclick="loadEvents()">Show Events</button>
    <div id="events"></div>
    <script>
    function loadEvents() {
    fetch("/events")
        .then(res => res.json())
        .then(data => {
            document.getElementById("events").innerHTML = JSON.stringify(data);
        });
}
</script>
<div class="container">
    <h2>Disaster News/Alert</h2>
    </div>
</body>
</html>
