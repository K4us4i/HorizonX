<!DOCTYPE html>
<html>
<head>
    <title>Community Connectivity</title>
</head> 
<body>
    <h2>Events</h2>
    <button onclick="loadEvents()">Show Events</button>
    <div id="events"></div>

    <h2>Disaster Alerts</h2>
    <button onclick="loadAlerts()">Show Alerts</button>
    <div id="alerts"></div>

    <script>
    function loadEvents() {
    fetch("/events")
        .then(res => res.json())
        .then(data => {
            document.getElementById("events").innerHTML = JSON.stringify(data);
        });
    }
    function loadAlerts() {
    fetch("/alerts")
        .then(res => res.json())
        .then(data => {
            document.getElementById("alerts").innerHTML = JSON.stringify(data);
        });
    }
    </script>
</body>
</html>
