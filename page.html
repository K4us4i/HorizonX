<!DOCTYPE html>
<html>
<head>
    <title>Community Connectivity</title>
</head>
<body>
    <div clas="container">
    <h2>Events</h2>
    <form method=[POST]>
        <script>
            <button>Today</button>
            fetch('/https://calendar.bloggernepal.com/api/today')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').innerText = data.message;
                });
        </script>
        <button>This week</button>
        <button>This month</button>
    </form>
    </div>
    <div class="container">
    <h2>Disaster News/Alert</h2>
    </div>

</body>
</html>
